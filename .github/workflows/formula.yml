name: formula

on:
  pull_request:
    paths:
      - .github/workflows/formula.yml
      - Formula/*.rb
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      formulae: ${{ steps.formulae.outputs.result }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        id: formulae
        with:
          script: |
            const globber = await glob.create('Formula/*.rb')
            const paths = await globber.glob()

            const fs = require('fs')

            // A bare `depends_on :macos` means macOS-only, so it is not tested on Linux.
            // Versioned forms (`macos: :ventura`) still install on Linux.
            const include = paths.flatMap((path) => {
              const formula = path.split('/').pop().replace(/\.rb$/, '')
              const macosOnly = /^\s*depends_on\s+:macos\s*$/m.test(fs.readFileSync(path, 'utf8'))
              const oses = macosOnly ? ['macos-latest'] : ['macos-latest', 'ubuntu-latest']
              return oses.map((os) => ({ formula, os }))
            })

            console.log(include)
            return include

  test:
    name: test (${{ matrix.os }}, ${{ matrix.formula }})
    runs-on: ${{ matrix.os }}
    needs: [list]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.list.outputs.formulae) }}

    env:
      HOMEBREW_GITHUB_ACTIONS: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@2026.10.26.1
        id: set-up-homebrew

      - name: Tap repository
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/arbourd"
          ln -s "$PWD" "$(brew --repository)/Library/Taps/arbourd/homebrew-tap"

      - if: ${{ matrix.formula == 'go' }}
        name: brew uninstall go
        run: |
          versions=$(brew list | grep -E '^go$|^go@' || true)
          echo $versions

          for v in $versions
          do
            echo "brew uninstall $v"
            brew uninstall $v
          done

      - name: brew style ${{ matrix.formula }}
        run: brew style -v arbourd/tap/${{ matrix.formula }}

      - name: brew audit ${{ matrix.formula }}
        run: brew audit --strict --online --except=version arbourd/tap/${{ matrix.formula }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: brew install ${{ matrix.formula }}
        run: brew install -v arbourd/tap/${{ matrix.formula }}

      - name: brew test ${{ matrix.formula }}
        run: brew test -v arbourd/tap/${{ matrix.formula }}
