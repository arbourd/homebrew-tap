name: formula

on:
  pull_request:
    paths:
      - .github/workflows/formula.yml
      - Formula/*.rb
      - tools/formulae/**
      - go.*
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      formulae: ${{ steps.formulae.outputs.formulae }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          cache: false
          go-version-file: go.mod

      - id: formulae
        shell: bash
        # On PRs, test only changed files unless the workflow or generator changed.
        run: |
          files=$(ls Formula/*.rb)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if ! grep -qE '^(go\.|tools/formulae/|\.github/workflows/formula\.yml)' <<<"$changed"; then
              files=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- 'Formula/*.rb')
            fi
          fi
          names=$(echo "$files" | jq -Rnc '[inputs | select(. != "") | sub(".*/"; "") | sub("\\.rb$"; "")]')
          matrix=$(go run ./tools/formulae --matrix | jq -c --argjson names "$names" 'map(select(.formula | IN($names[])))')
          echo "formulae=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }}, ${{ matrix.formula }})
    if: needs.list.outputs.formulae != '[]'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    needs: [list]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.list.outputs.formulae) }}

    env:
      HOMEBREW_GITHUB_ACTIONS: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        id: set-up-homebrew

      - name: Tap repository
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/arbourd"
          ln -s "$PWD" "$(brew --repository)/Library/Taps/arbourd/homebrew-tap"

      - if: ${{ matrix.formula == 'go' }}
        name: brew uninstall go
        run: |
          versions=$(brew list | grep -E '^go$|^go@' || true)
          echo "$versions"

          for v in $versions
          do
            echo "brew uninstall $v"
            brew uninstall "$v"
          done

      - name: brew style ${{ matrix.formula }}
        run: brew style -v arbourd/tap/${{ matrix.formula }}

      - name: brew audit ${{ matrix.formula }}
        run: brew audit --strict --online --except=version arbourd/tap/${{ matrix.formula }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: brew install ${{ matrix.formula }}
        run: brew install -v arbourd/tap/${{ matrix.formula }}

      - name: brew test ${{ matrix.formula }}
        run: brew test -v arbourd/tap/${{ matrix.formula }}
