name: cask-bump

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest

    env:
      HOMEBREW_GITHUB_ACTIONS: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@2026.10.26.1
      - uses: Homebrew/actions/git-user-config@2026.10.26.1

      - name: Tap repository
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/arbourd"
          ln -s "$PWD" "$(brew --repository)/Library/Taps/arbourd/homebrew-tap"

      - name: brew bump
        run: brew bump --cask --full-name --no-fork --open-pr arbourd/tap/orca

      - name: approve cask checks
        uses: actions/github-script@v9
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
            const awaiting = async () => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'cask.yml',
                event: 'pull_request',
                status: 'action_required',
              })
              // Only bump PRs opened by the bot from this repo, never forks or hand-made branches.
              return data.workflow_runs.filter(
                (run) =>
                  run.actor.login === 'github-actions[bot]' &&
                  run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                  run.head_branch.startsWith('bump-'),
              )
            }

            // The run appears a few seconds after the PR opens.
            let runs = await awaiting()
            for (let i = 0; i < 6 && !runs.length; i++) {
              await sleep(5000)
              runs = await awaiting()
            }

            if (!runs.length) core.warning('no cask.yml run awaiting approval')
            for (const run of runs) {
              try {
                await github.rest.actions.approveWorkflowRun({ ...context.repo, run_id: run.id })
              } catch (error) {
                core.warning(`could not approve run ${run.id}: ${error.message}`)
              }
            }
