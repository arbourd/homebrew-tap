name: cask-bump

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      casks: ${{ steps.casks.outputs.result }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@v9
        id: casks
        with:
          script: |
            const globber = await glob.create('Casks/*.rb')
            const paths = await globber.glob()

            const casks = paths.map((path) => path.split('/').pop().replace(/\.rb$/, ''))

            console.log(casks)
            return casks

  bump:
    runs-on: ubuntu-latest
    needs: [list]
    permissions:
      actions: write
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        cask: ${{ fromJson(needs.list.outputs.casks) }}

    env:
      HOMEBREW_GITHUB_ACTIONS: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1

      - name: brew livecheck ${{ matrix.cask }}
        run: |
          brew livecheck --cask --json arbourd/tap/${{ matrix.cask }} > "$RUNNER_TEMP/livecheck.json"
          jq . "$RUNNER_TEMP/livecheck.json"

      - name: Check ${{ matrix.cask }} version
        id: cask
        run: |
          version=$(jq -r '.[0].version | select(.outdated) | .latest' "$RUNNER_TEMP/livecheck.json")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: brew bump-cask-pr ${{ matrix.cask }}
        if: steps.cask.outputs.version != ''
        run: brew bump-cask-pr --write-only --no-audit --version "${{ steps.cask.outputs.version }}" arbourd/tap/${{ matrix.cask }}

      - name: Create Pull Request
        id: pr
        if: steps.cask.outputs.version != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bump-${{ matrix.cask }}-${{ steps.cask.outputs.version }}
          commit-message: ${{ matrix.cask }} ${{ steps.cask.outputs.version }}
          title: ${{ matrix.cask }} ${{ steps.cask.outputs.version }}
          reviewers: arbourd
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: approve cask checks
        if: steps.pr.outputs.pull-request-number != ''
        uses: actions/github-script@v9
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
            const branch = /^bump-${{ matrix.cask }}-\d/
            const awaiting = async () => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'cask.yml',
                event: 'pull_request',
                status: 'action_required',
              })
              // Only this cask's PRs opened by the bot from this repo, never forks or hand-made branches.
              return data.workflow_runs.filter(
                (run) =>
                  run.actor.login === 'github-actions[bot]' &&
                  run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                  branch.test(run.head_branch),
              )
            }

            // The run appears a few seconds after the PR opens.
            let runs = await awaiting()
            for (let i = 0; i < 6 && !runs.length; i++) {
              await sleep(5000)
              runs = await awaiting()
            }

            if (!runs.length) core.warning('no cask.yml run awaiting approval')
            for (const run of runs) {
              try {
                await github.rest.actions.approveWorkflowRun({ ...context.repo, run_id: run.id })
              } catch (error) {
                core.warning(`could not approve run ${run.id}: ${error.message}`)
              }
            }
