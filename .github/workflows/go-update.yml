name: go

on:
  pull_request:
    paths:
      - .github/workflows/go-update.yml
      - tools/go/**
  push:
    branches: [main]
    paths:
      - .github/workflows/go-update.yml
      - tools/go/**
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - name: Run go update
        id: go
        run: |
          formula=$(go run ./tools/go)

          echo "::group::formula"
          echo "${formula}"
          echo "::endgroup::"

          echo "${formula}" > Formula/go.rb
          version=$(echo "$formula" | grep -oP 'version "\K[^"]+')

          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: go-${{ steps.go.outputs.version }}
          commit-message: Go v${{ steps.go.outputs.version }}
          title: Go v${{ steps.go.outputs.version }}
          body: |
            https://go.dev/doc/devel/release#go${{ steps.go.outputs.version }}
          reviewers: arbourd
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: approve formula checks
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
            const awaiting = async () => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'formula.yml',
                event: 'pull_request',
                status: 'action_required',
              })
              // Only go PRs opened by the bot from this repo, never forks or hand-made branches.
              return data.workflow_runs.filter(
                (run) =>
                  run.actor.login === 'github-actions[bot]' &&
                  run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                  run.head_branch.startsWith('go-'),
              )
            }

            // The run appears a few seconds after the PR opens.
            let runs = await awaiting()
            for (let i = 0; i < 6 && !runs.length; i++) {
              await sleep(5000)
              runs = await awaiting()
            }

            if (!runs.length) core.warning('no formula.yml run awaiting approval')
            for (const run of runs) {
              try {
                await github.rest.actions.approveWorkflowRun({ ...context.repo, run_id: run.id })
              } catch (error) {
                core.warning(`could not approve run ${run.id}: ${error.message}`)
              }
            }
