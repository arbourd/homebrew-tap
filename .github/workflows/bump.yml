name: bump

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest

    env:
      HOMEBREW_GITHUB_ACTIONS: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@2026.10.19.1
      - uses: Homebrew/actions/git-user-config@2026.10.19.1

      - name: Tap repository
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/arbourd"
          ln -s "$PWD" "$(brew --repository)/Library/Taps/arbourd/homebrew-tap"

      # Formulae must have a top-level url/sha256; GoReleaser's per-arch blocks can't be bumped.
      - name: brew bump
        run: brew bump --full-name --no-fork --open-pr arbourd/tap/orca

      - name: approve checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for sha in $(gh pr list --author app/github-actions --json headRefOid --jq '.[].headRefOid'); do
            for id in $(gh run list --commit "$sha" --status action_required --json databaseId --jq '.[].databaseId'); do
              gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve"
            done
          done
