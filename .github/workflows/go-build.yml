name: go

on:
  pull_request:
    paths:
      - .github/workflows/go-build.yml
      - go.*
      - tools/go/**
  push:
    paths:
      - .github/workflows/go-build.yml
      - go.*
      - tools/go/**
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./... -v -race
      - run: go run ./tools/go
