name: go

on:
  pull_request:
    paths:
      - .github/workflows/go-build.yml
      - .github/workflows/formulae-update.yml
      - go.*
      - tools/formulae/**
  push:
    paths:
      - .github/workflows/go-build.yml
      - .github/workflows/formulae-update.yml
      - go.*
      - tools/formulae/**
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./... -v -race
      - run: go run ./tools/formulae go

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9

  vulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          cache: false
