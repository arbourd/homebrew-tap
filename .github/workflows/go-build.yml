name: go

on:
  pull_request:
    paths:
      - .github/workflows/go-build.yml
      - .github/workflows/formulae-update.yml
      - go.*
      - tools/formulae/**
  push:
    paths:
      - .github/workflows/go-build.yml
      - .github/workflows/formulae-update.yml
      - go.*
      - tools/formulae/**
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./... -v -race
      - run: go run ./tools/formulae go

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9

  vulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # The action defaults this to "stable", which overrides go-version-file.
          go-version-input: ""
          go-version-file: go.mod
          cache: false
