name: formulae

on:
  pull_request:
    paths:
      - .github/workflows/formulae-update.yml
      - tools/formulae/**
  push:
    branches: [main]
    paths:
      - .github/workflows/formulae-update.yml
      - tools/formulae/**
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      formulae: ${{ steps.formulae.outputs.formulae }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          cache: false
          go-version-file: go.mod
      - id: formulae
        run: echo "formulae=$(go run ./tools/formulae --list)" >> "$GITHUB_OUTPUT"

  update:
    runs-on: ubuntu-latest
    needs: [list]
    permissions:
      actions: write
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJson(needs.list.outputs.formulae) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          cache: false
          go-version-file: go.mod

      - name: Run formula update
        id: formula
        run: |
          go run ./tools/formulae ${{ matrix.formula }} > Formula/${{ matrix.formula }}.rb

          echo "::group::formula"
          cat Formula/${{ matrix.formula }}.rb
          echo "::endgroup::"

          version=$(grep -oP 'version "\K[^"]+' Formula/${{ matrix.formula }}.rb)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          notes=$(go run ./tools/formulae --notes ${{ matrix.formula }} "${version}")
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        id: pr
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ matrix.formula }}-${{ steps.formula.outputs.version }}
          commit-message: ${{ matrix.formula }} ${{ steps.formula.outputs.version }}
          title: ${{ matrix.formula }} ${{ steps.formula.outputs.version }}
          body: |
            ${{ steps.formula.outputs.notes }}
          reviewers: arbourd
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: approve formula checks
        if: steps.pr.outputs.pull-request-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
            const branch = /^${{ matrix.formula }}-\d/
            const awaiting = async () => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'formula.yml',
                event: 'pull_request',
                status: 'action_required',
              })
              // Only this formula's PRs opened by the bot from this repo, never forks or hand-made branches.
              return data.workflow_runs.filter(
                (run) =>
                  run.actor.login === 'github-actions[bot]' &&
                  run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                  branch.test(run.head_branch),
              )
            }

            // The run appears a few seconds after the PR opens.
            let runs = await awaiting()
            for (let i = 0; i < 6 && !runs.length; i++) {
              await sleep(5000)
              runs = await awaiting()
            }

            if (!runs.length) core.warning('no formula.yml run awaiting approval')
            for (const run of runs) {
              try {
                await github.rest.actions.approveWorkflowRun({ ...context.repo, run_id: run.id })
              } catch (error) {
                core.warning(`could not approve run ${run.id}: ${error.message}`)
              }
            }
