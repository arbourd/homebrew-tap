name: cask

on:
  pull_request:
    paths:
      - .github/workflows/cask.yml
      - Casks/*.rb
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      casks: ${{ steps.casks.outputs.result }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        id: casks
        with:
          script: |
            const globber = await glob.create('Casks/*.rb')
            const paths = await globber.glob()

            const casks = paths.map((path) => path.split('/').pop().replace(/\.rb$/, ''))

            console.log(casks)
            return casks

  test:
    runs-on: macos-latest
    needs: [list]
    strategy:
      fail-fast: false
      matrix:
        cask: ${{ fromJson(needs.list.outputs.casks) }}

    env:
      HOMEBREW_GITHUB_ACTIONS: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@2026.10.19.1

      - name: Tap repository
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/arbourd"
          ln -s "$PWD" "$(brew --repository)/Library/Taps/arbourd/homebrew-tap"

      - name: brew style ${{ matrix.cask }}
        run: brew style --cask -v arbourd/tap/${{ matrix.cask }}

      - name: brew audit ${{ matrix.cask }}
        # livecheck_version fails whenever upstream ships before cask-bump.yml catches up
        run: brew audit --cask --strict --online --except livecheck_version arbourd/tap/${{ matrix.cask }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: brew livecheck ${{ matrix.cask }}
        run: brew livecheck --cask arbourd/tap/${{ matrix.cask }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: brew install ${{ matrix.cask }}
        run: brew install --cask -v arbourd/tap/${{ matrix.cask }}

      - name: check apps installed
        run: |
          set -o pipefail
          brew info --cask --json=v2 arbourd/tap/${{ matrix.cask }} \
            | jq -r '.casks[].artifacts[] | select(.app) | .app[] | if type == "object" then .target else . end' \
            | while IFS= read -r app; do
                echo "checking /Applications/$app"
                test -d "/Applications/$app"
              done

      - name: brew uninstall ${{ matrix.cask }}
        run: brew uninstall --cask --zap -v arbourd/tap/${{ matrix.cask }}
