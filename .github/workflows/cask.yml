name: cask

on:
  pull_request:
    paths:
      - .github/workflows/cask.yml
      - Casks/*.rb
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      casks: ${{ steps.casks.outputs.casks }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - id: casks
        shell: bash
        # On PRs, test only changed files unless the workflow changed.
        run: |
          files=$(ls Casks/*.rb)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if ! grep -qxF .github/workflows/cask.yml <<<"$changed"; then
              files=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- 'Casks/*.rb')
            fi
          fi
          casks=$(echo "$files" | jq -Rnc '[inputs | select(. != "") | sub(".*/"; "") | sub("\\.rb$"; "")]')
          echo "casks=$casks" >> "$GITHUB_OUTPUT"

  test:
    if: needs.list.outputs.casks != '[]'
    runs-on: macos-latest
    permissions:
      contents: read
    needs: [list]
    strategy:
      fail-fast: false
      matrix:
        cask: ${{ fromJson(needs.list.outputs.casks) }}

    env:
      HOMEBREW_GITHUB_ACTIONS: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1

      - name: Tap repository
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/arbourd"
          ln -s "$PWD" "$(brew --repository)/Library/Taps/arbourd/homebrew-tap"

      - name: brew style ${{ matrix.cask }}
        run: brew style --cask -v arbourd/tap/${{ matrix.cask }}

      - name: brew audit ${{ matrix.cask }}
        # livecheck_version fails whenever upstream ships before cask-bump.yml catches up
        run: brew audit --cask --strict --online --except livecheck_version arbourd/tap/${{ matrix.cask }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: brew livecheck ${{ matrix.cask }}
        run: brew livecheck --cask arbourd/tap/${{ matrix.cask }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: brew install ${{ matrix.cask }}
        run: brew install --cask -v arbourd/tap/${{ matrix.cask }}

      - name: check apps installed
        run: |
          set -o pipefail
          brew info --cask --json=v2 arbourd/tap/${{ matrix.cask }} \
            | jq -r '.casks[].artifacts[] | select(.app) | .app[] | if type == "object" then .target else . end' \
            | while IFS= read -r app; do
                echo "checking /Applications/$app"
                test -d "/Applications/$app"
              done

      - name: brew uninstall ${{ matrix.cask }}
        run: brew uninstall --cask --zap -v arbourd/tap/${{ matrix.cask }}
