# yaml-language-server: $schema=formulae.schema.json
# One entry per formula, keyed by formula name. The formulae-update.yml matrix is built from these keys.
git-get:
  repo: arbourd/git-get
  desc: Go gets your code
  conflicts: [git-extras]
  install:
    - bin.install "git-get"
    - man1.install "man/git-get.1"
    - bash_completion.install "completions/git-get.bash" => "git-get"
    - zsh_completion.install "completions/git-get.zsh" => "_git_get"
    - fish_completion.install "completions/git-get.fish"
  test: |-
    repo = "github.com/arbourd/git-get"
    assert_match "#{testpath}/src/#{repo}", shell_output("#{bin}/git-get #{repo}")

    cd "#{testpath}/src/#{repo}" do
      assert_match "https://#{repo}", shell_output("git remote -v")
    end

git-open:
  repo: arbourd/git-open
  desc: Opens your Git repository in your browser
  conflicts: [git-open]
  install:
    - bin.install "git-open"
    - man1.install "man/git-open.1"
  test: |-
    url = "https://github.com/arbourd/git-open"
    system "git", "init", "-b", "main"
    system "git", "remote", "add", "origin", "#{url}.git"
    system "git", "-c", "user.name=test", "-c", "user.email=test@example.com",
           "commit", "--allow-empty", "-m", "init"
    sha = shell_output("git rev-parse HEAD").strip
    touch "main.go"

    assert_match "Opening #{url} ", shell_output(bin/"git-open")
    assert_match "Opening #{url}/tree/main/main.go ", shell_output("#{bin}/git-open main.go")
    assert_match "Opening #{url}/commit/#{sha} ", shell_output("#{bin}/git-open #{sha}")

git-sync:
  repo: arbourd/git-sync
  desc: Updates your branches
  conflicts: [git-extras, git-sync]
  install:
    - bin.install "git-sync"
    - man1.install "man/git-sync.1"
  test: |-
    system "git", "clone", "https://github.com/arbourd/git-sync.git"

    cd "git-sync" do
      system "git", "reset", "--hard", "HEAD~1"
      sha = shell_output("git rev-parse HEAD")

      assert_match sha[0..6], shell_output(bin/"git-sync")
      refute_equal sha, shell_output("git rev-parse HEAD")
    end

trash:
  repo: arbourd/trash
  desc: Safely move items to macOS trash asynchronously
  mac_only: true
  conflicts: [macos-trash, trash, trash-cli]
  install:
    - bin.install "trash"
  test: |-
    assert_match "trash, version #{version}", shell_output("#{bin}/trash --version")

    # The brew sandbox forbids writing to the real Trash, so only the error path can run.
    assert_match "could not be moved to the trash",
                 shell_output("#{bin}/trash #{testpath}/missing 2>&1", 1)

opengrep:
  repo: opengrep/opengrep
  desc: Static code analysis engine to find bugs and vulnerabilities
  urls:
    darwin-arm64: https://github.com/opengrep/opengrep/releases/download/v#{version}/opengrep_osx_arm64
    darwin-amd64: https://github.com/opengrep/opengrep/releases/download/v#{version}/opengrep_osx_x86
    linux-amd64: https://github.com/opengrep/opengrep/releases/download/v#{version}/opengrep_manylinux_x86
    linux-arm64: https://github.com/opengrep/opengrep/releases/download/v#{version}/opengrep_manylinux_aarch64
  install:
    - bin.install Dir["opengrep_*"].first => "opengrep"
  test: |-
    # opengrep crashes if XDG_CONFIG_HOME (set by brew to testpath/.config) does not exist.
    (testpath/".config").mkpath
    assert_match version.to_s, shell_output("#{bin}/opengrep --version")

    (testpath/"rule.yml").write <<~YAML
      rules:
        - id: no-eval
          pattern: eval(...)
          message: no eval
          languages: [python]
          severity: WARNING
    YAML
    (testpath/"test.py").write "eval(input())\n"
    assert_match "1 Code Finding",
                 shell_output("#{bin}/opengrep scan --config rule.yml test.py")

go:
  source: go
  homepage: https://go.dev/
  release_notes: https://go.dev/doc/devel/release#go#{version}
  desc: Open source programming language to build simple/reliable/efficient software
  install:
    - libexec.install Dir["*"]
    - bin.install_symlink Dir[libexec/"bin/go*"]
  test: |-
    (testpath/"hello.go").write <<~EOS
      package main

      import "fmt"

      func main() {
          fmt.Println("Hello World")
      }
    EOS

    # Run go fmt check for no errors then run the program.
    # This is a bare minimum of go working as it uses fmt, build, and run.
    system bin/"go", "fmt", "hello.go"
    assert_equal "Hello World\n", shell_output("#{bin}/go run hello.go")

    with_env(GOOS: "freebsd", GOARCH: "amd64") do
      system bin/"go", "build", "hello.go"
    end

    (testpath/"hello_cgo.go").write <<~EOS
      package main

      /*
      #include <stdlib.h>
      #include <stdio.h>
      void hello() { printf("%s\\n", "Hello from cgo!"); fflush(stdout); }
      */
      import "C"

      func main() {
          C.hello()
      }
    EOS

    # Try running a sample using cgo without CC or CXX set to ensure that the
    # toolchain's default choice of compilers work
    with_env(CC: nil, CXX: nil) do
      assert_equal "Hello from cgo!\n", shell_output("#{bin}/go run hello_cgo.go")
    end
